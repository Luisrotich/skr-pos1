<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="POS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>POS</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<style>
/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;
  --panel:#0b0f16;
  --card:#0f141c;
  --card-hi:#161d28;
  --line:#1e2733;
  --blue:#0a84ff;
  --blue-2:#0069d9;
  --blue-soft:rgba(10,132,255,.14);
  --green:#12a150;
  --text:#fff;
  --muted:#8b96a8;
  --red:#ef4444;
  --amber:#f59e0b;
  color-scheme:dark;
}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:#000;
  background-image:radial-gradient(1100px 520px at 50% -8%,#0a1a2e 0%,#000 62%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,Arial,sans-serif;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit}
input{font-family:inherit}
h1,h2,h3,p{margin:0}

/* ============ HEADER ============ */
.appheader{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,#05070c 70%,rgba(5,7,12,.92));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-top)) 14px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:44px;height:44px;flex:0 0 44px;border-radius:12px;
  background:linear-gradient(145deg,var(--blue),#0057b8);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:15px;letter-spacing:.5px;color:#fff;
  box-shadow:0 4px 16px rgba(10,132,255,.35);
}
.bname{font-size:17px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.cashier{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px;margin-top:2px}
.clock{font-size:12px;font-weight:800;color:var(--blue);text-align:right;line-height:1.35;letter-spacing:.3px}

/* ============ LAYOUT ============ */
main{padding:14px 14px calc(104px + env(safe-area-inset-bottom)) 14px;max-width:1100px;margin:0 auto}
.page{display:none;animation:fade .16s ease}
.page.active{display:block}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.ptitle{font-size:22px;font-weight:900;letter-spacing:.4px;margin:2px 0 12px}

/* ============ SEARCH ============ */
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
#search{
  width:100%;height:58px;border-radius:15px;background:var(--card);
  border:1px solid var(--line);color:#fff;font-size:17px;font-weight:600;
  padding:0 14px 0 44px;outline:none;appearance:none;
}
#search::placeholder{color:#5b6676;font-weight:500}
#search:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
#search::-webkit-search-cancel-button{-webkit-appearance:none}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.toolbar .count{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.mini{
  height:40px;padding:0 14px;border-radius:11px;border:1px solid #1c3a5e;
  background:var(--blue-soft);color:#66b3ff;font-weight:800;font-size:13px;
  letter-spacing:.5px;cursor:pointer;
}
.mini:active{transform:scale(.97)}

/* ============ PRODUCT GRID ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}}
.pcard{
  position:relative;background:linear-gradient(180deg,var(--card-hi),var(--card));
  border:1px solid var(--line);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;gap:5px;min-height:186px;
}
.pname{font-size:16px;font-weight:800;line-height:1.25;padding-right:26px;word-break:break-word}
.pcat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:21px;font-weight:900;margin-top:2px;letter-spacing:.2px}
.stock{font-size:13px;font-weight:800}
.stock.ok{color:#4ade80}
.stock.low{color:var(--amber)}
.stock.out{color:var(--red)}
.addbtn{
  margin-top:auto;height:50px;border-radius:13px;border:0;
  background:linear-gradient(180deg,var(--blue),var(--blue-2));
  color:#fff;font-size:16px;font-weight:900;letter-spacing:.6px;
  cursor:pointer;transition:transform .08s,background .15s;
}
.addbtn:active{transform:scale(.97)}
.addbtn:disabled{background:#161d28;color:#4e5a6b;cursor:not-allowed;transform:none}
.addbtn.flash{background:linear-gradient(180deg,#18c25f,#0f8b45)}
.editbtn{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;
  border:1px solid var(--line);background:#0b1017;color:#7c8798;
  font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.editbtn:active{background:#151d28}

/* ============ EMPTY STATES ============ */
.empty{
  grid-column:1/-1;text-align:center;padding:44px 18px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:18px;
}
.empty .eicon{font-size:40px;margin-bottom:10px}
.empty h3{font-size:17px;font-weight:800;color:#dfe6f0;margin-bottom:6px}
.empty p{font-size:14px;line-height:1.5;max-width:320px;margin:0 auto}
.empty .mini{margin-top:16px}

/* ============ CART ============ */
.citem{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px;margin-bottom:10px;
}
.citop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ciname{font-size:17px;font-weight:800;line-height:1.25;word-break:break-word}
.rmbtn{
  flex:0 0 auto;background:transparent;border:1px solid #40202a;color:#ff8181;
  border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;letter-spacing:.4px;cursor:pointer;
}
.rmbtn:active{background:#2a1114}
.cicalc{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}
.cicalc b{color:#fff;font-size:15px}
.qtyrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.qbtn{
  width:52px;height:52px;border-radius:14px;border:1px solid #1c3a5e;
  background:var(--blue-soft);color:#fff;font-size:24px;font-weight:900;
  line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.qbtn:active{background:#123a63;transform:scale(.95)}
.qval{min-width:46px;text-align:center;font-size:22px;font-weight:900}

.cartfoot{
  margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:16px;
}
.sumrow{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);font-weight:700;padding:6px 0}
.sumrow b{color:#fff;font-size:17px;font-weight:800}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.sumrow.total span{font-size:17px;color:#dfe6f0;font-weight:800}
.sumrow.total b{font-size:30px;color:var(--blue);font-weight:900}
.paybtns{display:grid;gap:10px;margin-top:14px}

/* ============ BUTTONS ============ */
.btn{
  width:100%;min-height:56px;border:0;border-radius:15px;
  font-size:17px;font-weight:900;letter-spacing:.7px;cursor:pointer;
  transition:transform .08s,opacity .15s;padding:0 16px;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,var(--blue),var(--blue-2));color:#fff}
.btn-cash{background:linear-gradient(180deg,var(--blue),var(--blue-2));color:#fff;min-height:66px;font-size:20px}
.btn-mpesa{background:linear-gradient(180deg,#17b45c,#0d8a45);color:#fff;min-height:66px;font-size:20px}
.btn-ghost{background:#161d28;color:#c6d0dd;border:1px solid var(--line)}
.btn-danger{background:#261114;color:#ff8f8f;border:1px solid #4a1c22}

/* ============ BOTTOM NAV ============ */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#05070c;border-top:1px solid var(--line);
  display:flex;gap:4px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
}
nav button{
  flex:1;background:transparent;border:0;color:#67717f;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px;border-radius:14px;cursor:pointer;font-size:11px;
  font-weight:900;letter-spacing:.7px;transition:background .15s,color .15s;
}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--blue);background:var(--blue-soft)}
nav button:active{background:rgba(255,255,255,.05)}
.icowrap{position:relative;display:inline-flex}
.badge{
  position:absolute;top:-7px;right:-13px;background:var(--blue);color:#fff;
  font-size:11px;font-weight:900;font-style:normal;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2px solid #05070c;line-height:1;
}

/* ============ MODALS ============ */
.modal{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:#0b0f16;width:100%;max-width:540px;
  border-radius:24px 24px 0 0;border-top:2px solid var(--blue);
  padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
  max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slide .2s ease;
}
@keyframes slide{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:640px){
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:22px;border-top:2px solid var(--blue);padding-bottom:20px}
}
.mtitle{font-size:21px;font-weight:900;letter-spacing:.3px;margin-bottom:4px}
.msub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.mrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line);
  font-size:15px;color:var(--muted);font-weight:700;
}
.mrow b{color:#fff;font-size:17px;font-weight:900}
.mrow .big{font-size:28px;color:var(--blue)}
.mbtns{display:grid;gap:10px;margin-top:20px}
.pill{
  font-size:12px;font-weight:900;padding:6px 12px;border-radius:999px;
  letter-spacing:.8px;display:inline-block;
}
.pill.cash{background:var(--blue);color:#fff}
.pill.mpesa{background:var(--green);color:#fff}
.flabel{
  display:block;font-size:11px;font-weight:900;letter-spacing:.8px;
  text-transform:uppercase;color:var(--muted);margin:16px 0 7px;
}
.flabel .opt{color:#5b6676;font-weight:700;text-transform:none;letter-spacing:0}
.input{
  width:100%;height:56px;border-radius:13px;background:#0b1017;
  border:1px solid var(--line);color:#fff;font-size:17px;font-weight:600;
  padding:0 14px;outline:none;appearance:none;
}
.input::placeholder{color:#4e5a6b;font-weight:500}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.okmsg{
  background:rgba(18,161,80,.12);border:1px solid rgba(18,161,80,.4);
  color:#4ade80;font-weight:800;font-size:14px;padding:11px 13px;
  border-radius:12px;margin:10px 0 4px;
}

/* ============ RECEIPT ============ */
.receipt{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  font-size:13px;line-height:1.5;background:#05080d;border:1px solid var(--line);
  border-radius:12px;padding:16px;margin:14px 0 0;white-space:pre;overflow:auto;
  max-height:46vh;color:#dbe4ef;
}

/* ============ HISTORY ============ */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px}
.stat .lbl{font-size:10px;letter-spacing:.9px;font-weight:900;color:var(--muted);text-transform:uppercase}
.stat .val{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:.2px}
.stat.full{grid-column:1/-1}
.stat.full .val{font-size:28px;color:var(--blue)}
.stat.cash .val{color:#66b3ff}
.stat.mpesa .val{color:#4ade80}

.seg{
  display:flex;gap:5px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:5px;margin-bottom:10px;
}
.seg button{
  flex:1;height:44px;border:0;border-radius:11px;background:transparent;
  color:var(--muted);font-weight:900;font-size:13px;letter-spacing:.7px;cursor:pointer;
}
.seg button.active{background:var(--blue);color:#fff}
.dateinput{
  width:100%;height:52px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);color:#fff;font-size:15px;font-weight:700;
  padding:0 14px;outline:none;margin-bottom:14px;appearance:none;
}
.dateinput:focus{border-color:var(--blue)}

.sale{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:10px;cursor:pointer;
}
.sale:active{background:#131a24}
.sale-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sno{font-size:15px;font-weight:900;letter-spacing:.5px}
.sale-time{font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.sale-items{font-size:14px;color:#c6d0dd;font-weight:600;margin-top:10px;line-height:1.6}
.sale-total{
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);margin-top:11px;padding-top:11px;
  font-size:13px;color:var(--muted);font-weight:800;
}
.sale-total b{font-size:19px;color:#fff}

/* ============ TOAST ============ */
#toast{
  position:fixed;left:50%;transform:translate(-50%,14px);
  bottom:calc(96px + env(safe-area-inset-bottom));
  background:#101720;border:1px solid #24405f;color:#fff;
  padding:13px 20px;border-radius:14px;font-size:14px;font-weight:800;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ PRINT ============ */
#printRoot{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff !important;color:#000 !important;background-image:none !important}
  body > *{display:none !important}
  #printRoot{
    display:block !important;color:#000 !important;background:#fff !important;
    font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;
    font-size:13px;line-height:1.5;
  }
  #printRoot pre{white-space:pre-wrap;margin:0;font-family:inherit;font-size:inherit}
}
</style>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="appheader">
  <div class="hrow">
    <div class="brand">
      <div class="logo">POS</div>
      <div>
        <div class="bname">MY POS</div>
        <div class="cashier" id="cashierLabel">Cashier</div>
      </div>
    </div>
    <div class="clock" id="clock">—</div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main>

  <!-- ---------- HOME ---------- -->
  <section id="page-home" class="page active">
    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
      </svg>
      <input id="search" type="search" placeholder="Search products..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="toolbar">
      <span class="count" id="prodCount">0 products</span>
      <button class="mini" onclick="openProductForm(null)">+ PRODUCT</button>
    </div>
    <div id="productGrid" class="grid"></div>
  </section>

  <!-- ---------- CART ---------- -->
  <section id="page-cart" class="page">
    <h2 class="ptitle">Cart</h2>
    <div id="cartList"></div>
    <div class="cartfoot" id="cartFoot" style="display:none">
      <div class="sumrow"><span>Subtotal</span><b id="cartSubtotal">KES 0</b></div>
      <div class="sumrow total"><span>Total</span><b id="cartTotal">KES 0</b></div>
      <div class="paybtns">
        <button class="btn btn-cash" id="payCash" onclick="cashModal()">CASH</button>
        <button class="btn btn-mpesa" id="payMpesa" onclick="mpesaModal()">M-PESA</button>
      </div>
    </div>
  </section>

  <!-- ---------- HISTORY ---------- -->
  <section id="page-history" class="page">
    <h2 class="ptitle">Sales History</h2>

    <div class="stats">
      <div class="stat full">
        <div class="lbl" id="statTitle">Today's Sales</div>
        <div class="val" id="statTotal">KES 0</div>
      </div>
      <div class="stat cash">
        <div class="lbl">Cash</div>
        <div class="val" id="statCash">KES 0</div>
      </div>
      <div class="stat mpesa">
        <div class="lbl">M-Pesa</div>
        <div class="val" id="statMpesa">KES 0</div>
      </div>
      <div class="stat full">
        <div class="lbl">Transactions</div>
        <div class="val" id="statCount">0</div>
      </div>
    </div>

    <div class="seg">
      <button data-filter="ALL" class="active" onclick="setFilter('ALL')">ALL</button>
      <button data-filter="CASH" onclick="setFilter('CASH')">CASH</button>
      <button data-filter="M-PESA" onclick="setFilter('M-PESA')">M-PESA</button>
    </div>

    <input type="date" id="histDate" class="dateinput" onchange="setHistDate(this.value)">

    <div id="historyList"></div>
  </section>

</main>

<!-- ================= BOTTOM NAV ================= -->
<nav>
  <button data-page="home" class="active" onclick="go('home')">
    <svg viewBox="0 0 24 24"><path d="M3 10.4 12 3l9 7.4V21h-5.5v-6.2h-7V21H3z"/></svg>
    <span>HOME</span>
  </button>
  <button data-page="cart" onclick="go('cart')">
    <span class="icowrap">
      <svg viewBox="0 0 24 24"><path d="M6.5 6h14l-1.6 9.2H8.1z"/><path d="M6.5 6 5.6 2.5H2.5"/><circle cx="9.5" cy="20" r="1.6"/><circle cx="17.5" cy="20" r="1.6"/></svg>
      <i class="badge" id="cartBadge" style="display:none">0</i>
    </span>
    <span>CART</span>
  </button>
  <button data-page="history" onclick="go('history')">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9.5 8.5h5M9.5 12.5h5"/></svg>
    <span>HISTORY</span>
  </button>
</nav>

<div id="modalRoot"></div>
<div id="toast"></div>
<div id="printRoot"></div>
<script>
/* ============ CONFIG ============ */
const API_BASE = '/api';
const CASHIER  = 'Cashier';

/* ============ API CLIENT ============ */
async function apiGet(path){
  const r = await fetch(API_BASE + path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiSend(method, path, body){
  const r = await fetch(API_BASE + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body == null ? undefined : JSON.stringify(body)
  });
  if (!r.ok){
    let msg = 'HTTP ' + r.status;
    try { const j = await r.json(); if (j.error) msg = j.error; } catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

/* ============ STATE ============ */
let products = [];
let sales    = [];
let cart = (() => {
  try { return JSON.parse(localStorage.getItem('pos.cart.v1') || '[]'); }
  catch(e){ return []; }
})();
let searchQuery   = '';
let historyFilter = 'ALL';
let historyDate   = isoDate(new Date());
let editingId     = null;

function saveCart(){
  try { localStorage.setItem('pos.cart.v1', JSON.stringify(cart)); } catch(e){}
}

/* ============ HELPERS ============ */
function $(s){ return document.querySelector(s); }
function num(n){ return Number(n||0).toLocaleString('en-KE',{maximumFractionDigits:2}); }
function money(n){ return 'KES ' + num(n); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return n<10?'0'+n:''+n; }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dayLabel(d){
  const t = isoDate(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if (isoDate(d)===t) return 'Today';
  if (isoDate(d)===isoDate(y)) return 'Yesterday';
  return d.toLocaleDateString('en-GB');
}
function timeLabel(d){ return d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function receiptNo(no){ return '#'+String(no).padStart(6,'0'); }

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ============ CLOCK ============ */
function tick(){
  const d = new Date();
  $('#clock').textContent =
    d.toLocaleDateString([],{weekday:'short',day:'2-digit',month:'short'}) +
    ' • ' + d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ============ NAV ============ */
function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+page));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===page));
  window.scrollTo(0,0);
  if (page==='cart')    renderCart();
  if (page==='history') renderHistory();
  if (page==='home')    renderProducts();
}

/* ============ DATA LOADERS ============ */
async function refreshProducts(){
  try { products = await apiGet('/products'); renderProducts(); }
  catch(e){ toast('Failed to load products'); }
}
async function refreshSales(){
  try { sales = await apiGet('/sales'); renderHistory(); }
  catch(e){ /* silent */ }
}

/* ============ PRODUCTS ============ */
function renderProducts(){
  const grid = $('#productGrid');
  const q = searchQuery.trim().toLowerCase();
  const list = products.filter(p =>
    !q || p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q)
  );

  $('#prodCount').textContent = products.length + (products.length===1?' product':' products');

  if (!list.length){
    grid.innerHTML = products.length
      ? `<div class="empty"><div class="eicon">🔍</div><h3>No products match</h3><p>Try a different product name or category.</p></div>`
      : `<div class="empty"><div class="eicon">📦</div><h3>No products yet</h3><p>Add your first product to start selling.</p><button class="mini" onclick="openProductForm(null)">+ ADD PRODUCT</button></div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const out = p.stock <= 0;
    const inCart = (cart.find(l=>l.id===p.id)||{}).qty || 0;
    const remaining = p.stock - inCart;
    const stockClass = out ? 'out' : (remaining<=3?'low':'ok');

    let stockText;
    if (out) stockText = 'OUT OF STOCK';
    else if (inCart) stockText = 'Stock: ' + p.stock + ' · ' + inCart + ' in cart';
    else stockText = 'Stock: ' + p.stock;

    let btnLabel, disabled;
    if (out){ btnLabel='OUT OF STOCK'; disabled=true; }
    else if (remaining<=0){ btnLabel='MAX IN CART'; disabled=true; }
    else { btnLabel='+ ADD'; disabled=false; }

    return `<div class="pcard">
      <button class="editbtn" onclick="openProductForm('${p.id}')" aria-label="Edit">✎</button>
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pcat">${escapeHtml(p.category||'Uncategorised')}</div>
      <div class="price">${money(p.price)}</div>
      <div class="stock ${stockClass}">${escapeHtml(stockText)}</div>
      <button class="addbtn" data-add="${p.id}" ${disabled?'disabled':''} onclick="addToCart('${p.id}')">${btnLabel}</button>
    </div>`;
  }).join('');
}

function addToCart(id){
  const p = products.find(x=>x.id===id);
  if (!p) return;
  if (p.stock <= 0){ toast('Out of stock'); return; }

  const line = cart.find(l=>l.id===id);
  const inCart = line ? line.qty : 0;
  if (inCart + 1 > p.stock){ toast('Only ' + p.stock + ' in stock'); return; }

  if (line) line.qty++;
  else cart.push({ id:p.id, name:p.name, price:p.price, buyPrice:p.buyPrice||0, qty:1 });

  saveCart();
  renderProducts();
  renderCart();

  const btn = document.querySelector('[data-add="'+id+'"]');
  if (btn){
    const orig = btn.textContent;
    btn.classList.add('flash');
    btn.textContent = '✓ ADDED';
    setTimeout(()=>{
      if (!btn.isConnected) return;
      btn.classList.remove('flash');
      btn.textContent = orig;
    }, 550);
  }
}

/* ============ PRODUCT FORM ============ */
function openProductForm(id){
  editingId = id || null;
  const p = id ? products.find(x=>x.id===id) : null;

  openModal(`
    <h2 class="mtitle">${p?'Edit Product':'Add Product'}</h2>
    <p class="msub">${p?'Update the details of this product.':'Add a product so you can start selling.'}</p>

    <label class="flabel">Product name</label>
    <input id="fName" class="input" type="text" placeholder="e.g. Chicken Burger" value="${p?escapeHtml(p.name):''}">

    <div class="frow">
      <div>
        <label class="flabel">Buying Price (KES)</label>
        <input id="fBuy" class="input" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${p?(p.buyPrice||0):''}">
      </div>
      <div>
        <label class="flabel">Selling Price (KES)</label>
        <input id="fPrice" class="input" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${p?p.price:''}">
      </div>
    </div>

    <div class="frow">
      <div>
        <label class="flabel">Stock</label>
        <input id="fStock" class="input" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${p?p.stock:''}">
      </div>
      <div>
        <label class="flabel">Category</label>
        <input id="fCat" class="input" type="text" placeholder="e.g. Food" value="${p?escapeHtml(p.category||''):''}">
      </div>
    </div>

    <div class="mbtns">
      <button class="btn btn-primary" onclick="saveProduct()">${p?'SAVE CHANGES':'ADD PRODUCT'}</button>
      ${p?'<button class="btn btn-danger" onclick="deleteProduct()">DELETE PRODUCT</button>':''}
      <button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>
    </div>
  `);
  setTimeout(()=>{ const el=$('#fName'); if(el) el.focus(); },120);
}

async function saveProduct(){
  const name  = $('#fName').value.trim();
  const buy   = parseFloat($('#fBuy').value);
  const price = parseFloat($('#fPrice').value);
  const stock = parseInt($('#fStock').value,10);
  const cat   = $('#fCat').value.trim();

  if (!name){ toast('Enter a product name'); return; }
  if (isNaN(buy)||buy<0){ toast('Enter a valid buying price'); return; }
  if (isNaN(price)||price<0){ toast('Enter a valid selling price'); return; }
  if (isNaN(stock)||stock<0){ toast('Enter a valid stock quantity'); return; }

  const payload = { name, buyPrice: buy, price, stock, category: cat };

  try {
    if (editingId){
      await apiSend('PUT', '/products/' + editingId, payload);
      cart.forEach(l => { if (l.id===editingId){ l.name=name; l.price=price; l.buyPrice=buy; } });
      saveCart();
    } else {
      await apiSend('POST', '/products', payload);
    }
    closeModal();
    await refreshProducts();
    renderCart();
    toast(editingId ? 'Product updated' : 'Product added');
    editingId = null;
  } catch(e){ toast('Save failed: ' + e.message); }
}

async function deleteProduct(){
  const p = products.find(x=>x.id===editingId);
  if (!p) return;
  if (!confirm('Delete "'+p.name+'"?')) return;
  try {
    await apiSend('DELETE', '/products/' + editingId);
    cart = cart.filter(l=>l.id!==editingId);
    saveCart();
    closeModal();
    await refreshProducts();
    renderCart();
    toast('Product deleted');
    editingId = null;
  } catch(e){ toast('Delete failed: ' + e.message); }
}

/* ============ CART ============ */
function cartTotal(){ return cart.reduce((s,l)=>s+l.price*l.qty,0); }
function cartCount(){ return cart.reduce((s,l)=>s+l.qty,0); }

function renderCart(){
  const list = $('#cartList');
  const foot = $('#cartFoot');

  if (!cart.length){
    list.innerHTML = `<div class="empty"><div class="eicon">🛒</div><h3>Cart is empty</h3><p>Add products from the Home screen to start a sale.</p></div>`;
    foot.style.display = 'none';
  } else {
    foot.style.display = 'block';
    list.innerHTML = cart.map(l=>`
      <div class="citem">
        <div class="citop">
          <div class="ciname">${escapeHtml(l.name)}</div>
          <button class="rmbtn" onclick="removeItem('${l.id}')">REMOVE</button>
        </div>
        <div class="cicalc">${money(l.price)} × ${l.qty} = <b>${money(l.price*l.qty)}</b></div>
        <div class="qtyrow">
          <button class="qbtn" onclick="changeQty('${l.id}',-1)">−</button>
          <div class="qval">${l.qty}</div>
          <button class="qbtn" onclick="changeQty('${l.id}',1)">+</button>
        </div>
      </div>
    `).join('');

    const total = cartTotal();
    $('#cartSubtotal').textContent = money(total);
    $('#cartTotal').textContent    = money(total);
  }

  updateBadge();
}

function updateBadge(){
  const badge = $('#cartBadge');
  const count = cartCount();
  if (count > 0){
    badge.textContent = count > 99 ? '99+' : count;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
}

function changeQty(id, delta){
  const line = cart.find(l=>l.id===id);
  if (!line) return;

  if (delta > 0){
    const p = products.find(x=>x.id===id);
    if (p && line.qty + 1 > p.stock){ toast('Only '+p.stock+' in stock'); return; }
    line.qty++;
  } else {
    line.qty--;
    if (line.qty <= 0) cart = cart.filter(l=>l.id!==id);
  }

  saveCart();
  renderCart();
  renderProducts();
}

function removeItem(id){
  cart = cart.filter(l=>l.id!==id);
  saveCart();
  renderCart();
  renderProducts();
}

/* ============ PAYMENT ============ */
function cashModal(){
  if (!cart.length){ toast('Cart is empty'); return; }
  openModal(`
    <h2 class="mtitle">Confirm Cash Sale</h2>
    <p class="msub">Record this sale as paid in cash.</p>
    <div class="mrow"><span>Total</span><b class="big">${money(cartTotal())}</b></div>
    <div class="mrow"><span>Payment Method</span><b class="pill cash">CASH</b></div>
    <div class="mrow" style="border-bottom:0"><span>Items</span><b>${cartCount()}</b></div>
    <div class="mbtns">
      <button class="btn btn-primary" onclick="completeSale('CASH')">CONFIRM SALE</button>
      <button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>
    </div>
  `);
}

function mpesaModal(){
  if (!cart.length){ toast('Cart is empty'); return; }
  openModal(`
    <h2 class="mtitle">Confirm M-Pesa Sale</h2>
    <p class="msub">Record this sale as paid through M-Pesa.</p>
    <div class="mrow"><span>Total</span><b class="big">${money(cartTotal())}</b></div>
    <div class="mrow"><span>Payment Method</span><b class="pill mpesa">M-PESA</b></div>
    <label class="flabel">M-Pesa Transaction Code <span class="opt">(optional)</span></label>
    <input id="mpesaCode" class="input" type="text" placeholder="e.g. QK12AB34CD"
           autocapitalize="characters" autocomplete="off" spellcheck="false">
    <div class="mbtns">
      <button class="btn btn-mpesa" onclick="completeSale('M-PESA')">CONFIRM M-PESA SALE</button>
      <button class="btn btn-ghost" onclick="closeModal()">CANCEL</button>
    </div>
  `);
  setTimeout(()=>{ const el=$('#mpesaCode'); if(el) el.focus(); },120);
}

async function completeSale(method){
  if (!cart.length){ toast('Cart is empty'); return; }

  const codeEl = $('#mpesaCode');
  const code = (method === 'M-PESA' && codeEl) ? codeEl.value.trim().toUpperCase() : '';

  const payload = {
    items: cart.map(l=>({ id:l.id, name:l.name, price:l.price, buyPrice:l.buyPrice||0, qty:l.qty })),
    method, code, cashier: CASHIER
  };

  try {
    const sale = await apiSend('POST', '/sales', payload);

    cart = [];
    saveCart();
    await Promise.all([refreshProducts(), refreshSales()]);
    renderCart();

    historyDate = isoDate(new Date(sale.ts));
    $('#histDate').value = historyDate;
    renderHistory();

    showReceipt(sale, true);
  } catch(e){
    toast('Sale failed: ' + e.message);
  }
}

/* ============ RECEIPT ============ */
function padLine(left, right, width){
  width = width || 32;
  if (left.length + right.length + 1 > width){
    left = left.slice(0, Math.max(1, width - right.length - 2));
  }
  const gap = Math.max(1, width - left.length - right.length);
  return left + ' '.repeat(gap) + right;
}

function receiptText(sale){
  const d = new Date(sale.ts);
  const LINE = '--------------------------------';
  let s = '';
  s += '            MY POS\n';
  s += '         SALES RECEIPT\n\n';
  s += 'Sale:    ' + receiptNo(sale.no) + '\n';
  s += 'Date:    ' + d.toLocaleDateString('en-GB') + '\n';
  s += 'Time:    ' + timeLabel(d) + '\n';
  s += 'Cashier: ' + sale.cashier + '\n';
  s += LINE + '\n';
  sale.items.forEach(i=>{
    s += padLine(i.name + ' x' + i.qty, num(i.price*i.qty)) + '\n';
    if (i.qty > 1) s += padLine('  @ ' + num(i.price), '') + '\n';
  });
  s += LINE + '\n';
  s += padLine('TOTAL', num(sale.total)) + '\n';
  s += '\nPayment: ' + sale.method + '\n';
  if (sale.code) s += 'M-Pesa Code: ' + sale.code + '\n';
  s += '\n          Thank you!\n';
  return s;
}

function showReceipt(sale, justCompleted){
  const txt = receiptText(sale);
  $('#printRoot').innerHTML = '<pre>' + escapeHtml(txt) + '</pre>';
  openModal(`
    <h2 class="mtitle">${justCompleted?'Sale Complete':'Receipt'}</h2>
    ${justCompleted?'<div class="okmsg">✓ Sale recorded successfully</div>':''}
    <pre class="receipt">${escapeHtml(txt)}</pre>
    <div class="mbtns">
      <button class="btn btn-primary" onclick="window.print()">PRINT RECEIPT</button>
      <button class="btn btn-ghost" onclick="closeModal()">DONE</button>
    </div>
  `);
}

function viewSale(no){
  const sale = sales.find(s=>s.no===no);
  if (sale) showReceipt(sale, false);
}

/* ============ MODALS ============ */
function openModal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal" id="modal"><div class="sheet">${html}</div></div>`;
  const m = $('#modal');
  m.addEventListener('click', e=>{ if (e.target===m) closeModal(); });
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });

/* ============ HISTORY ============ */
function setFilter(f){
  historyFilter = f;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active', b.dataset.filter===f));
  renderHistory();
}
function setHistDate(v){
  historyDate = v || isoDate(new Date());
  renderHistory();
}

function renderHistory(){
  const dated = sales.filter(s => isoDate(new Date(s.ts)) === historyDate);

  const total = dated.reduce((s,x)=>s+x.total,0);
  const cash  = dated.filter(s=>s.method==='CASH').reduce((s,x)=>s+x.total,0);
  const mpesa = dated.filter(s=>s.method==='M-PESA').reduce((s,x)=>s+x.total,0);

  const todayIso = isoDate(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  const yIso = isoDate(y);

  let title = "Today's Sales";
  if (historyDate === yIso) title = "Yesterday's Sales";
  else if (historyDate !== todayIso){
    const parts = historyDate.split('-');
    title = 'Sales · ' + new Date(+parts[0], +parts[1]-1, +parts[2]).toLocaleDateString('en-GB');
  }

  $('#statTitle').textContent = title;
  $('#statTotal').textContent = money(total);
  $('#statCash').textContent  = money(cash);
  $('#statMpesa').textContent = money(mpesa);
  $('#statCount').textContent = dated.length;

  const list = dated
    .filter(s => historyFilter==='ALL' || s.method===historyFilter)
    .sort((a,b)=> new Date(b.ts) - new Date(a.ts));

  const wrap = $('#historyList');

  if (!list.length){
    wrap.innerHTML = `<div class="empty"><div class="eicon">🧾</div><h3>No sales found</h3><p>${dated.length ? 'No '+historyFilter+' sales on this date.' : 'No sales recorded for this date.'}</p></div>`;
    return;
  }

  wrap.innerHTML = list.map(s=>{
    const d = new Date(s.ts);
    const items = s.items.map(i=>`${i.qty} × ${escapeHtml(i.name)}`).join('<br>');
    const codeLine = s.code ? `<div class="sale-time">M-Pesa Code: ${escapeHtml(s.code)}</div>` : '';
    return `<div class="sale" onclick="viewSale(${s.no})">
      <div class="sale-top">
        <span class="sno">SALE ${receiptNo(s.no)}</span>
        <span class="pill ${s.method==='CASH'?'cash':'mpesa'}">${s.method}</span>
      </div>
      <div class="sale-time">${dayLabel(d)} • ${timeLabel(d)}</div>
      <div class="sale-items">${items}</div>
      ${codeLine}
      <div class="sale-total"><span>Total</span><b>${money(s.total)}</b></div>
    </div>`;
  }).join('');
}

/* ============ INIT ============ */
(async function init(){
  $('#cashierLabel').textContent = CASHIER;
  tick();
  setInterval(tick, 1000);

  $('#search').addEventListener('input', e=>{ searchQuery = e.target.value; renderProducts(); });

  const dateInput = $('#histDate');
  dateInput.value = historyDate;
  dateInput.addEventListener('change', e => setHistDate(e.target.value));

  renderCart();
  await Promise.all([ refreshProducts(), refreshSales() ]);
})();
</script>
</body>
